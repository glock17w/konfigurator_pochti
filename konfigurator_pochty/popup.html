<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>Конфигуратор почты</h2>
  <div class="tabs">
    <button data-filter="all" class="active">Все <span class="cnt">0</span></button>
    <button data-filter="suspicious">Подозрительные <span class="cnt">0</span></button>
    <button data-filter="work">Работа <span class="cnt">0</span></button>
    <button data-filter="personal">Личное <span class="cnt">0</span></button>
    <button data-filter="newsletter">Рассылка <span class="cnt">0</span></button>
  </div>
  <div id="list"></div>
  <details class="settings">
    <summary>Рабочие домены</summary>
    <div class="add">
      <input id="domainInput" type="text" placeholder="например, company.ru">
      <button id="btnAddDomain">Добавить</button>
    </div>
    <div id="domains"></div>
  </details>
  <button id="btnClear" class="clear">Очистить список</button>
  <script src="popup.js"></script>
</body>
</html>
