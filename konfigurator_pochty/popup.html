<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>Конфигуратор почты</h2>
  <div class="tabs">
    <button id="btnAll">Все</button>
    <button id="btnSuspicious">Подозрительные</button>
    <button id="btnWork">Работа</button>
    <button id="btnPersonal">Личное</button>
    <button id="btnNewsletter">Рассылка</button>
  </div>
  <div id="list"></div>
  <details id="settings">
    <summary>Рабочие домены</summary>
    <div class="add-row">
      <input id="domainInput" placeholder="например, company.ru">
      <button id="btnAddDomain">Добавить</button>
    </div>
    <div id="domainError"></div>
    <ul id="domainList"></ul>
  </details>
  <script src="popup.js"></script>
</body>
</html>
